spring:
  application:
    name: nova-roupa-api
  profiles:
    # O profile dev ativa usuários mock somente para desenvolvimento local.
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:extensao.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    ldap:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Lista separada por vírgulas; usar origens explícitas em produção.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ldap:
    url: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:dc=example,dc=org}
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:uid={0},ou=people}
    group-search-base: ${LDAP_GROUP_SEARCH_BASE:ou=groups}
    group-search-filter: ${LDAP_GROUP_SEARCH_FILTER:(member={0})}
  jwt:
    # JWT_SECRET deve ser definido fora dos profiles dev/test.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  security:
    login-rate-limit:
      # Cinco tentativas por origem a cada minuto; podem ser ajustados por ambiente.
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-ms: ${LOGIN_RATE_LIMIT_WINDOW_MS:60000}
